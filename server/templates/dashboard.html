<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-32.png') }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
<meta name="theme-color" content="#164d72">
<!-- iOS ignores the web manifest for "Add to Home Screen" — it needs these
     specific meta tags instead to open full-screen without Safari's chrome
     and to use the right icon/status-bar style. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="stylesheet" href="{{ static_v('app.css') }}">
</head>
<body class="{{ 'kiosk' if kiosk else '' }}">
<header class="top">
  {% if not kiosk %}<button class="btn hamburger" id="menuBtn" aria-label="Menu">☰</button>{% endif %}
  <div class="brand">Pul<span>se</span></div>
  <div class="controls" id="controls">
    <div class="chips" id="periodChips"></div>
    <label class="range" id="customRange" hidden>
      <input type="datetime-local" id="fromDate" lang="en-GB"> <span>→</span> <input type="datetime-local" id="toDate" lang="en-GB">
    </label>
    <details class="pop" id="devPop"><summary id="devSummary"></summary><div class="popbody" id="devList"></div></details>
    <button class="btn" id="langBtn"></button>
    <button class="btn" id="refreshBtn"></button>
    <button class="btn" id="exportPdfBtn"></button>
    {% if not kiosk %}<a class="btn" href="/logout" id="logoutBtn"></a>{% endif %}
  </div>
  <div class="kioskinfo" id="kioskInfo"></div>
</header>
{% if not kiosk %}<nav class="tabs" id="tabs"></nav>
<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
<nav class="sidebar" id="sidebar" hidden></nav>{% endif %}
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal-wrap" id="remoteModal" hidden></div>
<script>
  window.PULSE = { kiosk: {{ 'true' if kiosk else 'false' }}, key: {{ screen_key|tojson }}, apk: {{ apk_url|tojson }} };
</script>
{% if not kiosk %}<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('{{ url_for("static", filename="sw.js") }}').catch(() => {}));
  }
</script>{% endif %}
<script src="{{ static_v('app.js') }}"></script>
</body>
</html>
