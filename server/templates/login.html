<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — تسجيل الدخول</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2a43;font-family:'Tajawal',system-ui,sans-serif;color:#10222f}
  form{background:#fff;border-radius:16px;padding:28px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  h1{font-size:1.6rem;margin-bottom:4px;color:#0f2a43;letter-spacing:.5px}
  h1 span{color:#0fb5a8}
  p{color:#5d7283;font-size:.9rem;margin-bottom:18px}
  label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border:1.5px solid #cfdbe5;border-radius:10px;font:inherit}
  input:focus{outline:none;border-color:#0fb5a8;box-shadow:0 0 0 3px rgba(15,181,168,.15)}
  button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#0fb5a8;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .err{background:#fde8e8;color:#9b1c1c;border-radius:8px;padding:8px 10px;font-size:.85rem;margin-bottom:6px}
</style></head><body>
<form method="post">
  <h1>Pul<span>se</span></h1>
  <p>لوحة رصد الأجهزة — تسجيل الدخول</p>
  {% if error %}<div class="err">اسم المستخدم أو كلمة المرور غير صحيحة</div>{% endif %}
  <label for="u">اسم المستخدم</label><input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">كلمة المرور</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">دخول</button>
</form></body></html>
