services:
  - type: web
    name: pulse
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: SCREEN_KEY
        sync: false
      - key: APK_DOWNLOAD_URL
        value: https://github.com/AcsVe/Pulse/releases/latest/download/Pulse.apk
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString

databases:
  - name: pulse-db
    plan: free
