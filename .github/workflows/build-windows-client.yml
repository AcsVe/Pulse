name: Build Pulse Windows Client

# Packages windows-client/ into three standalone executables (Pulse-Setup,
# PulseService, PulseHelper — see windows-client/README.md for what each
# one does and why there are three) and publishes them as a zip, so the
# stable link
#   https://github.com/<owner>/<repo>/releases/latest/download/Pulse-Windows-Client.zip
# always serves the newest build, the same pattern as build-server-exe.yml
# and build-apk.yml.
#
# Must run on a Windows runner — this uses pywin32 (a real Windows Service)
# and Win32 APIs throughout, so it can only be built on Windows, same
# cross-compile limitation build-server-exe.yml already explains.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "windows-client/**"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: windows-client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pywin32 ships its pywintypesXX.dll / pythoncomXX.dll under a
      # pywin32_system32 folder that PyInstaller's onefile mode doesn't
      # always manage to bundle correctly for a service exe — the
      # well-known fix is just copying those two DLLs next to each built
      # exe so Windows' loader finds them without needing them on PATH.
      - name: Locate pywin32 system DLLs
        id: pywin32dlls
        shell: pwsh
        run: |
          $dir = python -c "import win32api, os; print(os.path.join(os.path.dirname(os.path.dirname(win32api.__file__)), 'pywin32_system32'))"
          echo "dir=$dir" >> $env:GITHUB_OUTPUT

      # --icon on every single one of these: without it, PyInstaller stamps
      # its own default feather icon on the .exe, which is exactly what
      # instantly reads as "this is a Python app" in Explorer/Task
      # Manager/taskbar — every exe gets installer/pulse.ico instead.
      #
      # Pulse-Setup is a one-shot CLI tool with no startup-time budget to
      # respect, so --onefile (slower to launch, but a single small file)
      # is the right trade here.
      - name: Build Pulse-Setup.exe
        working-directory: windows-client
        run: pyinstaller --onefile --name Pulse-Setup --icon installer\pulse.ico --hidden-import win32timezone pulse_cli.py

      # PulseService and PulseHelper are built --onedir (the PyInstaller
      # default, a folder of files rather than one compressed exe) —
      # --onefile re-extracts its whole bundle to a temp folder on every
      # single launch, which is exactly what makes Windows' Service Control
      # Manager time out starting a --onefile service (see service_main.py's
      # docstring). --onedir pays that cost once, at build time, instead.
      - name: Build PulseService
        working-directory: windows-client
        run: pyinstaller --name PulseService --icon installer\pulse.ico --hidden-import win32timezone --hidden-import win32serviceutil service_main.py

      - name: Build PulseHelper
        working-directory: windows-client
        run: pyinstaller --windowed --name PulseHelper --icon installer\pulse.ico helper.py

      - name: Collect into one folder
        working-directory: windows-client
        shell: pwsh
        run: |
          mkdir out
          copy dist\Pulse-Setup.exe out\
          Copy-Item dist\PulseService out\PulseService -Recurse
          Copy-Item dist\PulseHelper out\PulseHelper -Recurse
          if (Test-Path README.md) { copy README.md out\ }
          $dlls = "${{ steps.pywin32dlls.outputs.dir }}"
          if (Test-Path $dlls) {
            copy "$dlls\*.dll" out\PulseService\
            copy "$dlls\*.dll" out\PulseHelper\
          }

      - name: Zip
        working-directory: windows-client
        run: Compress-Archive -Path out\* -DestinationPath Pulse-Windows-Client.zip
        shell: pwsh

      # The actual recommended install path from here on: a single Inno
      # Setup installer that stops any running old version, installs to a
      # fixed folder, excludes itself from Windows Defender, and runs the
      # enroll+install steps itself from a one-page wizard — see
      # windows-client/installer/pulse_setup.iss for why each piece exists.
      # windows-latest runners don't ship Inno Setup, so install it via
      # Chocolatey (already present on the runner image).
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Pulse-Setup-Installer.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$PWD\windows-client\out" `
            "windows-client\installer\pulse_setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Windows-Client
          path: windows-client/Pulse-Windows-Client.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Setup-Installer
          path: windows-client/installer/Pulse-Setup-Installer.exe

      - name: Publish release (stable download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-client-latest --cleanup-tag --yes || true
          gh release create windows-client-latest \
            windows-client/Pulse-Windows-Client.zip \
            windows-client/installer/Pulse-Setup-Installer.exe \
            --title "Pulse Windows client" \
            --notes "Recommended: download Pulse-Setup-Installer.exe and run it as Administrator — it stops any old version, installs to a fixed folder, excludes itself from Windows Defender, and asks once for the server URL + linking code (skipped automatically on an upgrade). Built from ${GITHUB_SHA::7}. The Pulse-Windows-Client.zip (Pulse-Setup.exe + PulseService/ + PulseHelper/) remains available for manual installs: Pulse-Setup.exe enroll <serverUrl> <code>, then Pulse-Setup.exe install." \
            --latest
