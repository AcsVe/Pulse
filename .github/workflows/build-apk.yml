name: Build Pulse Android APK

# Builds the Pulse native collector app and publishes it as a GitHub Release
# asset, so the stable link
#   https://github.com/<owner>/<repo>/releases/latest/download/Pulse.apk
# always serves the newest build (the dashboard's "Download the Pulse app"
# button on the Devices tab uses it).
#
# Signing (optional but recommended): without the secrets below the APK is
# debug-signed with a throw-away key — it installs fine, but every build has
# a different signature, so installing a NEWER build over an older one
# requires uninstalling first. Add these repository secrets once and every
# build is signed with the same key, so updates install over the old app:
#   ANDROID_KEYSTORE_BASE64   (base64 of your .jks/.keystore file)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD      (omit if same as the keystore password)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME); the
      # separate setup-android action's sdkmanager step fails on current
      # images, so just accept licenses and let Gradle fetch any missing piece.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare icon sources
        working-directory: android-app
        run: |
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-foreground.png

      - name: Install dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Write Capacitor config
        working-directory: android-app
        run: node scripts/configure.js

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Inject native collector sources
        working-directory: android-app
        run: node scripts/inject-native.js

      - name: Generate launcher icons
        working-directory: android-app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1e31' --iconBackgroundColorDark '#0b1e31' --splashBackgroundColor '#0b1e31' --splashBackgroundColorDark '#0b1e31'

      # capacitor-assets writes the adaptive-icon XMLs pointing at
      # @mipmap/ic_launcher_background, but only creates a *color* resource
      # with that name — repoint to @color and use the app's navy.
      - name: Fix adaptive icon background reference
        working-directory: android-app/android/app/src/main/res
        run: |
          sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' mipmap-anydpi-v26/*.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0b1e31</color>\n</resources>\n' > values/ic_launcher_background.xml

      - name: Sync web assets
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          chmod +x gradlew
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign / collect APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          OUT=android-app/android/app/build/outputs/apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$OUT/release/app-release-unsigned.apk" aligned.apk
            "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS:-$KS_PASS}" \
              --out out/Pulse.apk aligned.apk
            rm -f release.keystore aligned.apk
          else
            echo "::warning::No signing secrets set — using a debug-signed APK (updates need uninstall/reinstall)."
            cp "$OUT/debug/app-debug.apk" out/Pulse.apk
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: out/Pulse.apk

      - name: Publish release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest out/Pulse.apk \
            --title "Pulse Android app" \
            --notes "Device monitoring app. Built from ${GITHUB_SHA::7}." \
            --latest
